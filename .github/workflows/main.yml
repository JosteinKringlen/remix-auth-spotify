name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: 'package.json'

            - name: Install dependencies
              uses: bahmutov/npm-install@v1

            - name: Build
              run: npm run build

    typecheck:
        name: Typechecker
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: 'package.json'

            - name: Install dependencies
              uses: bahmutov/npm-install@v1

            - name: Typecheck
              run: npm run typecheck

    test:
        name: Unit and Integration Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: 'package.json'

            - name: Install dependencies
              uses: bahmutov/npm-install@v1

            - name: Test
              run: npm run test

    lint:
        name: Linter
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: 'package.json'

            - name: Install dependencies
              uses: bahmutov/npm-install@v1

            - name: Build
              run: npm run build

            - name: Lint
              run: npm run lint

    arethetypeswrong:
        name: ʦ Are The Types Wrong?
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout repo
              uses: actions/checkout@v7

            - name: ⎔ Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: 'package.json'

            - name: 📥 Install deps
              uses: bahmutov/npm-install@v1

            - name: 🏗️ Build
              run: npm run build

            - name: ʦ ATTW
              run: npm run typecheck:attw

    publint:
        name: 📖 Publint
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout repo
              uses: actions/checkout@v7

            - name: ⎔ Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: 'package.json'

            - name: 📥 Install deps
              uses: bahmutov/npm-install@v1

            - name: 🏗️ Build
              run: npm run build

            - name: 📖 Publint
              run: npm run lint:publint
